# CI/CD pipeline: build Docker image on push to main, then deploy to EC2
name: Build & Deploy

on:
  push:
    branches: [main]

jobs:
  # Step 1: Build the Docker image and push it to Docker Hub
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # Tags with both :latest and the commit SHA for traceability
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/lms-app:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/lms-app:${{ github.sha }}

  # Step 2: SSH into EC2 and pull the new image
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /opt/lms
            docker compose pull lms-app
            docker compose up -d --force-recreate lms-app
            # Clean up old images to reclaim disk space
            docker image prune -f
